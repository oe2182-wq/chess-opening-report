<title>Opening Report</title>
<link rel="stylesheet" href="src/styles.css">
<div class="layout">
  <div class="eval" id="eval">
    <span class="eval-score" id="eval-score"></span>
    <div class="eval-white" id="eval-white"></div>
  </div>
  <main class="board-column">
    <div class="player" id="player-top"></div>
    <div class="board" id="board"></div>
    <div class="player" id="player-bottom"></div>
  </main>
  <aside class="sidebar" id="sidebar"></aside>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="src/main.js"></script>
